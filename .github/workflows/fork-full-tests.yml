name: Fork full tree (POSIX)

# The repo's own CI asks for blacksmith-* runners, which a personal fork does not have, so
# every upstream workflow queues forever here. This file runs the same suite on GitHub-hosted
# Ubuntu so a fork can produce a real POSIX result. It is deliberately not part of a PR: the
# workflow lives on its own branch and is deleted after the run.
#
# Scope: `scripts/run_tests.sh`, the same command `just test-all` runs upstream (the core suite
# with per-file subprocess isolation). tests/e2e is a separate upstream job with its own Node and
# display requirements and is out of scope here.

on:
  workflow_dispatch:
  # Dispatch on this path never registers on the fork (API 422 "does not have
  # workflow_dispatch trigger"), so a push is the reliable trigger: push the branch under
  # ci/run/ and it runs on that exact tree.
  push:
    branches: ["ci/run/**"]

permissions:
  contents: read

concurrency:
  group: fork-full-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.slice }}/6)
    # github-hosted: 4 vCPU. Upstream runs 3 slices on 32-vCPU boxes (~10 min of packed work);
    # six 4-vCPU slices keep the same total work spread over the free tier's parallelism.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          packages: pnpm
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Run tests
        run: scripts/run_tests.sh
        env:
          HERMES_TEST_SLICE: ${{ matrix.slice }}/6
          HERMES_TEST_FORKSERVER: "1"
          HERMES_TEST_WORKERS: "4"
          # 4 vCPU instead of 32: a slow file gets three times its last healthy duration upstream,
          # and there is no duration cache on a fork, so allow a generous flat cap.
          HERMES_TEST_FILE_TIMEOUT: "1800"
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: failures-slice-${{ matrix.slice }}
          path: |
            .test-logs/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 7

# Re-registered so workflow_dispatch is picked up on the fork default branch.
